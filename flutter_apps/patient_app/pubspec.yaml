name: clinic_patient_app
description: White-Label Poly Clinic Patient Queue & Booking Android App (Zero-SMS Patient ID + Live Queue + Background Alerts)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
